name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          echo "No tests defined, skipping."

      - name: Build Docker image
        run: docker build -t content-writing-agent:latest .

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag content-writing-agent:latest ${{ secrets.DOCKERHUB_USERNAME }}/content-writing-agent:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/content-writing-agent:latest

      - name: Deploy (placeholder)
        run: echo "Deployment steps go here."
