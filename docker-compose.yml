version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - TAVILY_API_KEY
      - OPENAI_API_KEY
      - FLASK_ENV=production
    volumes:
      - .:/app
    command: gunicorn --bind 0.0.0.0:5000 app:app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    