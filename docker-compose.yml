version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - .:/app
    command: gunicorn -w 4 -b 0.0.0.0:5000 app:app

# No external databases or services detected, so docker-compose is minimal.
# Add services here if needed in the future.