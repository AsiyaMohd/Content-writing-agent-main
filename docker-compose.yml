version: '3.8'
services:
  content-writing-agent:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LANGCHAIN_HANDLER=generic
      # Add other env vars as needed, e.g. API keys
    volumes:
      - .:/app
    command: gunicorn -b 0.0.0.0:5000 app:app
